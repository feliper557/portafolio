<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Felipe Rodríguez · Desarrollador Full Stack .NET + React</title>
    <meta
      name="description"
      content="Desarrollador Full Stack .NET y React con ocho años sobre un ERP contable en producción: APIs, integraciones fiscales y modernización de sistemas heredados. Disponible para proyectos freelance."
    />

    <!--
      Vista previa al compartir el enlace por WhatsApp, LinkedIn o correo.
      El prerenderizado (scripts/prerender.tsx) reescribe título, descripción y
      og:url con los valores de cada ruta y añade el canonical.

      Falta og:image: sin una imagen de 1200×630 en public/, el enlace se comparte
      como una caja gris. La etiqueta no se declara mientras el archivo no exista,
      porque una imagen rota se ve peor que ninguna.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Felipe Rodríguez · Desarrollador Full Stack .NET + React" />
    <meta
      property="og:description"
      content="Sistemas que aguantan producción: APIs, integraciones fiscales y modernización de legado. Portafolio con casos reales."
    />
    <meta property="og:locale" content="es_CO" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
