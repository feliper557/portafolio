name: Portafolio · CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Compilar y desplegar
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Falla el pipeline ante cualquier error de tipos, antes de desplegar nada.
      - name: Verificar tipos
        run: npx tsc -b

      - name: Compilar
        run: npm run build

      # La configuracion vive en la raiz, pero solo se publica el contenido de
      # dist, asi que hay que llevarla dentro del artefacto.
      - name: Copiar configuracion de Static Web Apps al artefacto
        run: cp staticwebapp.config.json dist/

      - name: Desplegar en Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_SEA_045520A0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          # app_location apunta directo al build: con skip_app_build la accion
          # sube todo lo que haya en esa ruta, y desde '/' arrastraba node_modules.
          app_location: 'dist'
          api_location: ''
          output_location: ''
          # El build ya se hizo arriba; Oryx no debe recompilar.
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Cerrar entorno de vista previa
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_SEA_045520A0F }}
          action: 'close'
